# Baut bei jeder Änderung auf main die Web-Version und veröffentlicht sie
# über GitHub Pages: https://pandusferandus.github.io/felltracker/
name: Web-Vorschau

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typprüfung
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Web-Version bauen
        run: npm run build:web
      - name: Für GitHub Pages vorbereiten
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
