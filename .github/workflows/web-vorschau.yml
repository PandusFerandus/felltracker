# Baut bei jeder Änderung auf main die Web-Version und veröffentlicht sie
# über GitHub Pages: https://pandusferandus.github.io/felltracker/
# Vorher laufen Typprüfung, Tests und die Tests der Datenbank-Zugriffsregeln.
name: Web-Vorschau

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # Leere Test-Datenbank, um die Zugriffsregeln für Supabase zu prüfen
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typprüfung
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Tests der Zugriffsregeln (Datenbank)
        run: npm run test:db
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/postgres
      - name: Web-Version bauen
        run: npm run build:web
      - name: Für GitHub Pages vorbereiten
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
